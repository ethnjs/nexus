name: Backend CI

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Run pytest
        env:
          APP_ENV: test
          API_KEY: ""
          TEST_DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_test
        run: uv run pytest