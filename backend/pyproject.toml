[project]
name = "nexus-backend"
# Placeholder. The release version lives in VERSION, written by semantic-release.
# This project is never built or installed as a package.
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3,<4",
    "fastapi>=0.142.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.60.0",
    "nanoid>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "passlib[bcrypt]>=1.7.4",
    # passlib (unmaintained) breaks on bcrypt >= 4.1
    "bcrypt<4.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "resend[async]>=2.49.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
