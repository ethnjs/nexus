[project]
name = "nexus-backend"
# Placeholder. The release version lives in VERSION, written by semantic-release.
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3,<4",
    "fastapi>=0.142.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.60.0",
    "nanoid>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "resend[async]>=2.49.1",
    "authlib>=1.9.1",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "discord-py>=2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# `Column == True/False` builds SQL; `not Column` would not.
ignore = ["E712"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make it first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "app.core.tournament.permissions.require_membership",
    "app.core.tournament.permissions.require_permission",
    "app.core.tournament.permissions.require_any_permission",
    "app.core.tournament.permissions.require_catalog_read",
]
